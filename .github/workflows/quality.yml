name: Project quality
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  release-package:
    name: Check committed package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-notebook.txt
      - run: python -m pip check
      - run: python scripts/verify_package.py --read-only
      - run: git diff --exit-code

  reproduction:
    name: Reproduce the experiment
    needs: release-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-notebook.txt
      - run: python -m pip check
      - name: Preserve committed reference
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-reference"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release-reference"
      - run: python scripts/build_notebook.py
      - run: python scripts/build_docs.py
      - run: python scripts/check_release.py
      - run: python scripts/compare_reproduction.py --reference "$RUNNER_TEMP/release-reference"
      - run: python scripts/verify_package.py --read-only
